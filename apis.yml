aid: catchpoint-systems
name: Catchpoint Systems
description: >-
  Catchpoint Systems is an Internet Performance Monitoring (IPM) platform that helps enterprises
  observe the performance, reachability, and reliability of applications, APIs, networks, and services
  across the public internet. The platform combines synthetic monitoring (web, transaction, API, DNS,
  BGP, SSL, streaming, and network-layer tests), real user monitoring (RUM), endpoint/employee-experience
  monitoring, Internet Sonar outage detection, and a global observability network of monitoring nodes.
  Catchpoint exposes a REST API v2 (bearer/JWT authenticated, documented via a public Swagger UI) plus
  Alert and Test Data webhooks so teams can automate test management, pull raw and aggregated performance
  data, manage nodes and SLAs, and stream results into their own tooling. The company was added to the
  API Evangelist network as a portfolio company of Battery Ventures.
url: https://raw.githubusercontent.com/api-evangelist/catchpoint-systems/refs/heads/main/apis.yml
